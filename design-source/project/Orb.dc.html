    const LABEL = { working: 'Working', implementing: 'Working', searching: 'Searching', exploring: 'Searching', solving: 'Solving', debugging: 'Solving', listening: 'Listening', composing: 'Composing', shaping: 'Shaping', planning: 'Shaping', idle: 'Idle', blocked: 'Blocked', done: 'Done' };
    const size = Number(this.props.size) || 64;
    return { canvasRef: this._ref, px: size + 'px', aria: 'Thinking orb: ' + (LABEL[this.props.state] || 'Working') };
  }
}
</script>
</body>
</html>
