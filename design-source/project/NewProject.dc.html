<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New project dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0A}
*{box-sizing:border-box}
a{color:#EDEDED}a:hover{color:#FFFFFF}
:focus-visible{outline:2px solid #EDEDED;outline-offset:2px}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bav-fig,.bav-body,.bav-eyes-in,.bav-halo{transform-box:fill-box;transform-origin:center}
.bav-halo{opacity:0}
@keyframes bav-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes bav-blink{0%,88%,100%{transform:scaleY(1)}92%{transform:scaleY(.12)}}
@keyframes bav-morph{0%,100%{transform:scale(1,1)}33%{transform:scale(1.05,.95)}66%{transform:scale(.96,1.04)}}
@keyframes bav-drift{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
@keyframes dlg-in{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.s-idle .bav-body{animation:bav-breathe 4s ease-in-out infinite}
.s-idle .bav-eyes-in{animation:bav-blink 5s ease-in-out infinite}
.s-planning .bav-body{animation:bav-morph 3.2s ease-in-out infinite}
.s-planning .bav-eyes-in{animation:bav-drift 3.2s ease-in-out infinite}
.orb-dot{opacity:.22}
@keyframes orb{0%,100%{opacity:.18}35%{opacity:1}}
.o-spin .orb-dot{animation:orb 1.1s ease-in-out infinite}
.o-spin .orb-dot.c{animation:none;opacity:.6}
.dlg{animation:dlg-in 250ms cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position: relative; display: flex; flex-wrap: wrap; min-height: 100vh; background: #0A0A0A; color: #EDEDED; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5">
<div aria-hidden="true" style="flex: 1 1 232px; display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.08)">
<dc-import name="Sidebar" active="board" hint-size="232px,900px"></dc-import>
</div>
<div aria-hidden="true" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<dc-import name="TopBar" section="Board" hint-size="100%,56px"></dc-import>
</div>

<div style="position: absolute; inset: 0; background: rgba(0,0,0,0.62); display: flex; justify-content: center; align-items: center; padding: 24px">
<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="np-h" style="width: 100%; max-width: 580px; display: flex; flex-direction: column; border-radius: 16px; background: #141414; border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 24px 64px rgba(0,0,0,0.6)">
<header style="display: flex; align-items: center; gap: 10px; padding: 18px 20px 14px">
<h2 id="np-h" style="margin: 0; flex: 1; font-size: 17px; font-weight: 600; letter-spacing: -0.2px">New project</h2>
<button type="button" aria-label="Close" style="width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: #A1A1A1; display: grid; place-items: center"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" class="ic"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</header>
<div style="padding: 0 20px">
<div role="tablist" aria-label="Project source" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 10px; background: #0A0A0A; border: 1px solid rgba(255,255,255,0.08)">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
<button type="button" role="tab" aria-selected="{{m.on}}" onClick="{{m.pick}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; border-radius: 7px; border: 0; background: {{m.bg}}; color: {{m.fg}}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" class="ic"><path d="{{m.icon}}"></path></svg>{{m.label}}</button>
</sc-for>
</div>
</div>

<sc-if value="{{isOpen}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 20px 4px">
<label style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px; border-radius: 8px; background: #0A0A0A; border: 1px solid rgba(255,255,255,0.14)">
<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" class="ic" style="color: #8A8A8A"><path d="M11 4.5a6.5 6.5 0 1 1 0 13a6.5 6.5 0 1 1 0-13zM20 20l-4.4-4.4"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search repositories</span>
<input type="text" placeholder="Search repositories in ~/code" style="flex: 1; border: 0; background: transparent; color: #EDEDED; font: inherit; font-size: 13px; outline: none">
</label>
<div role="radiogroup" aria-label="Repositories found on this machine" style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{repos}}" as="r" hint-placeholder-count="4">
<button type="button" role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; border: 1px solid {{r.border}}; background: {{r.bg}}; color: #EDEDED; font: inherit; text-align: left; cursor: pointer">
<span style="width: 16px; height: 16px; flex: none; border-radius: 9999px; border: 1.5px solid {{r.ring}}; display: grid; place-items: center"><span style="width: 8px; height: 8px; border-radius: 9999px; background: #EDEDED; opacity: {{r.dot}}"></span></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 500">{{r.name}}</span><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #8A8A8A">{{r.path}}</span></span>
<span style="font-size: 12px; color: #A1A1A1; text-align: right">{{r.meta}}</span>
</button>
</sc-for>
</div>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px dashed rgba(255,255,255,0.18); background: transparent; color: #EDEDED; font: inherit; font-size: 13px; font-weight: 500; align-self: flex-start"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" class="ic"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"></path></svg>Choose another folder…</button>
</div>
</sc-if>

<sc-if value="{{isCreate}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 4px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 500; color: #A1A1A1">Name<input type="text" value="invoice-portal" style="height: 38px; padding: 0 12px; border-radius: 8px; background: #0A0A0A; border: 1px solid rgba(255,255,255,0.14); color: #EDEDED; font: inherit; font-size: 13px; font-weight: 400"></label>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="np-loc" style="font-size: 12px; font-weight: 500; color: #A1A1A1">Location</label>
<div style="display: flex; gap: 8px"><input id="np-loc" type="text" value="~/code/invoice-portal" style="flex: 1; height: 38px; padding: 0 12px; border-radius: 8px; background: #0A0A0A; border: 1px solid rgba(255,255,255,0.14); color: #EDEDED; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px"><button type="button" style="height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.14); background: #1B1B1B; color: #EDEDED; font: inherit; font-size: 13px; font-weight: 600">Browse</button></div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span id="np-tpl" style="font-size: 12px; font-weight: 500; color: #A1A1A1">Starting point</span>
<div role="radiogroup" aria-labelledby="np-tpl" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{templates}}" as="t" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{t.on}}" style="display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 10px; border: 1px solid {{t.border}}; background: {{t.bg}}; color: #EDEDED; font: inherit; text-align: left"><span style="font-size: 13px; font-weight: 500">{{t.name}}</span><span style="font-size: 11px; color: #A1A1A1">{{t.desc}}</span></button>
</sc-for>
</div>
</div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 13px"><input type="checkbox" checked style="width: 16px; height: 16px; margin: 0; accent-color: #EDEDED">Initialise a git repository</label>
<label style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #A1A1A1"><input type="checkbox" style="width: 16px; height: 16px; margin: 0; accent-color: #EDEDED">Create a GitHub remote <span style="font-size: 12px; color: #8A8A8A">· asks for push access later</span></label>
</div>
</sc-if>

<footer style="display: flex; align-items: center; gap: 8px; padding: 16px 20px; margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.08)">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: #8A8A8A; flex: 1"><dc-import name="Avatar" agent="atlas" size="16" state="idle" lead="false" hint-size="16px,16px"></dc-import>{{footNote}}</span>
<button type="button" style="height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.14); background: #1B1B1B; color: #EDEDED; font: inherit; font-size: 13px; font-weight: 600">Cancel</button>
<a href="FirstRun.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 8px; background: #EDEDED; color: #0A0A0A; text-decoration: none; font-size: 13px; font-weight: 600">{{cta}}</a>
</footer>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["open","create"],"default":"open"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const self = this;
    const mode = (this.state && this.state.mode) || this.props.mode || 'open';
    const pickedRepo = (this.state && this.state.repo) || 'ledger-api';
    const modes = [
      ['open', 'Open a repo', 'M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z'],
      ['create', 'Create a new repo', 'M12 5v14M5 12h14']
    ].map(function (m) {
      const on = m[0] === mode;
      return { label: m[1], icon: m[2], on: on ? 'true' : 'false', bg: on ? '#262626' : 'transparent', fg: on ? '#EDEDED' : '#A1A1A1', pick: function () { self.setState({ mode: m[0] }); } };
    });
    const repos = [
      ['ledger-api', '~/code/ledger-api', 'main · Node, Postgres'],
      ['tally-mobile', '~/code/tally-mobile', 'develop · React Native'],
      ['docs-site', '~/code/docs-site', 'main · Astro'],
      ['tally-web', '~/code/tally-web', 'Already a project']
    ].map(function (r) {
      const on = r[0] === pickedRepo;
      return { name: r[0], path: r[1], meta: r[2], on: on ? 'true' : 'false', bg: on ? '#1B1B1B' : 'transparent', border: on ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.06)', ring: on ? '#EDEDED' : 'rgba(255,255,255,0.3)', dot: on ? 1 : 0, pick: function () { self.setState({ repo: r[0] }); } };
    });
    const templates = [['Empty', 'README and .gitignore', true], ['Vite + React', 'TypeScript, Tailwind', false], ['Node API', 'Express, Vitest', false]].map(function (t) {
      return { name: t[0], desc: t[1], on: t[2] ? 'true' : 'false', bg: t[2] ? '#1B1B1B' : 'transparent', border: t[2] ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.08)' };
    });
    return {
      modes: modes, repos: repos, templates: templates,
      isOpen: mode === 'open', isCreate: mode === 'create',
      cta: mode === 'open' ? 'Open project' : 'Create project',
      footNote: mode === 'open' ? 'Atlas reads the repo locally next' : 'Atlas helps you write the first spec'
    };
  }
}
</script>
</body>
</html>
