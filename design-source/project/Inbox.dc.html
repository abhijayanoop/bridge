<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0A0A0A}
*{box-sizing:border-box}
a{color:#EDEDED}a:hover{color:#FFFFFF}
:focus-visible{outline:2px solid #EDEDED;outline-offset:2px}
.ic{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bav-fig,.bav-body,.bav-eyes-in,.bav-halo{transform-box:fill-box;transform-origin:center}
.bav-halo{opacity:0}
@keyframes bav-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes bav-blink{0%,88%,100%{transform:scaleY(1)}92%{transform:scaleY(.12)}}
@keyframes bav-morph{0%,100%{transform:scale(1,1)}33%{transform:scale(1.05,.95)}66%{transform:scale(.96,1.04)}}
@keyframes bav-drift{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
@keyframes bav-halo{0%{transform:scale(.95);opacity:.4}100%{transform:scale(1.45);opacity:0}}
.s-idle .bav-body{animation:bav-breathe 4s ease-in-out infinite}
.s-idle .bav-eyes-in{animation:bav-blink 5s ease-in-out infinite}
.s-planning .bav-body{animation:bav-morph 3.2s ease-in-out infinite}
.s-planning .bav-eyes-in{animation:bav-drift 3.2s ease-in-out infinite}
.s-listening .bav-halo{animation:bav-halo 1.8s ease-out infinite}
.s-blocked .bav-fig{opacity:.4;filter:saturate(.5)}
.orb-dot{opacity:.22}
@keyframes orb{0%,100%{opacity:.18}35%{opacity:1}}
@keyframes orb-pulse{0%,100%{opacity:.25}50%{opacity:.95}}
.o-spin .orb-dot{animation:orb 1.1s ease-in-out infinite}
.o-spin .orb-dot.c{animation:none;opacity:.6}
.o-pulse .orb-dot{animation:orb-pulse 1.6s ease-in-out infinite}
.o-still .orb-dot.c{opacity:.8}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.s-listening .bav-halo{opacity:.22;transform:scale(1.2)}.o-spin .orb-dot,.o-pulse .orb-dot{opacity:.6}}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; background: #0A0A0A; color: #EDEDED; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5">
<div style="flex: 1 1 232px; display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.08)">
<dc-import name="Sidebar" active="inbox" hint-size="232px,900px"></dc-import>
</div>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<dc-import name="TopBar" section="Inbox" inbox-active="{{ true }}" hint-size="100%,56px"></dc-import>
<main style="flex: 1; width: 100%; max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; padding: 28px 32px 48px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 24px; line-height: 30px; font-weight: 600; letter-spacing: -0.4px">Inbox</h1>
<span style="font-size: 13px; color: #A1A1A1">7 things need you. Agents keep working on anything that isn't waiting here.</span>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<div role="tablist" aria-label="Filter inbox" style="display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 10px; background: #141414; border: 1px solid rgba(255,255,255,0.08)">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="5">
<button type="button" role="tab" aria-selected="{{f.on}}" style="height: 28px; padding: 0 12px; border-radius: 7px; border: 0; background: {{f.bg}}; color: {{f.fg}}; font: inherit; font-size: 13px; font-weight: 500">{{f.label}} <span style="color: #8A8A8A">{{f.n}}</span></button>
</sc-for>
</div>
<span style="flex: 1"></span>
<span style="display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: #8A8A8A">
<kbd style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #EDEDED; border: 1px solid rgba(255,255,255,0.14); border-radius: 4px; padding: 0 5px; line-height: 18px">J</kbd><kbd style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #EDEDED; border: 1px solid rgba(255,255,255,0.14); border-radius: 4px; padding: 0 5px; line-height: 18px">K</kbd>move
<kbd style="margin-left: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #EDEDED; border: 1px solid rgba(255,255,255,0.14); border-radius: 4px; padding: 0 5px; line-height: 18px">Y</kbd>approve
<kbd style="margin-left: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #EDEDED; border: 1px solid rgba(255,255,255,0.14); border-radius: 4px; padding: 0 5px; line-height: 18px">N</kbd>deny
<kbd style="margin-left: 6px; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; color: #EDEDED; border: 1px solid rgba(255,255,255,0.14); border-radius: 4px; padding: 0 5px; line-height: 18px">R</kbd>reply
</span>
</div>

<sc-for list="{{items}}" as="it" hint-placeholder-count="7">
<article aria-labelledby="{{it.hid}}" style="display: flex; gap: 16px; padding: 18px; border-radius: 16px; background: #141414; border: 1px solid {{it.border}}; outline: {{it.outline}}; outline-offset: 2px">
<div style="flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 2px">
<dc-import name="Avatar" agent="{{it.agent}}" size="40" state="{{it.state}}" hint-size="40px,40px"></dc-import>
<dc-import name="Orb" agent="{{it.agent}}" size="20" state="{{it.state}}" hint-size="20px,20px"></dc-import>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: #A1A1A1">
<span style="font-size: 13px; font-weight: 600; color: #EDEDED">{{it.name}}</span>
<span style="display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); color: #EDEDED; font-size: 12px"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true" class="ic"><path d="{{it.icon}}"></path></svg>{{it.kind}}</span>
<sc-if value="{{it.ticket}}" hint-placeholder-val="{{ true }}"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #8A8A8A">{{it.ticket}}</span></sc-if>
<span style="flex: 1"></span>
<span>{{it.time}}</span>
</div>
<h2 id="{{it.hid}}" style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 600; letter-spacing: -0.1px">{{it.what}}</h2>
<p style="margin: 0; font-size: 13px; line-height: 20px; color: #A1A1A1"><span style="color: #EDEDED; font-weight: 500">Why · </span>{{it.why}}</p>

<sc-if value="{{it.hasDetails}}" hint-placeholder-val="{{ false }}">
<dl style="margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; padding: 12px 14px; border-radius: 10px; background: #0A0A0A; border: 1px solid rgba(255,255,255,0.06); font-size: 12px">
<sc-for list="{{it.details}}" as="d" hint-placeholder-count="2">
<dt style="color: #8A8A8A">{{d.k}}</dt><dd style="margin: 0; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #EDEDED; overflow-wrap: anywhere">{{d.v}}</dd>
</sc-for>
</dl>
</sc-if>

<sc-if value="{{it.hasTickets}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{it.tickets}}" as="t" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: #0A0A0A; border: 1px solid rgba(255,255,255,0.06); font-size: 13px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; color: #8A8A8A">{{t.id}}</span>
<span style="flex: 1; min-width: 0">{{t.title}}</span>
<dc-import name="Avatar" agent="{{t.agent}}" size="20" state="idle" hint-size="20px,20px"></dc-import>
<span style="font-size: 12px; color: #A1A1A1">{{t.note}}</span>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{it.replyOpen}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 12px; background: #0A0A0A; border: 1px solid rgba(255,255,255,0.18)">
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<button type="button" style="height: 28px; padding: 0 10px; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.14); background: #1B1B1B; color: #EDEDED; font: inherit; font-size: 12px">Presets only for v1</button>
<button type="button" style="height: 28px; padding: 0 10px; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.14); background: #1B1B1B; color: #EDEDED; font: inherit; font-size: 12px">Add “every N weeks”</button>
<button type="button" style="height: 28px; padding: 0 10px; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.14); background: #1B1B1B; color: #EDEDED; font: inherit; font-size: 12px">Ask Atlas to update the spec</button>
</div>
<label for="reply-tide" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Reply to Tide</label>
<textarea id="reply-tide" rows="2" placeholder="Reply to Tide…" style="resize: none; border: 0; background: transparent; color: #EDEDED; font: inherit; font-size: 13px; line-height: 20px; outline: none; padding: 2px 4px">Presets only for now. Hide “Custom” and leave a TODO linking BRG-104.</textarea>
</div>
</sc-if>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 2px">
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 8px; border: 0; background: #EDEDED; color: #0A0A0A; font: inherit; font-size: 13px; font-weight: 600"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" class="ic" style="stroke-width: 2"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>{{it.approve}}</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.14); background: #1B1B1B; color: #EDEDED; font: inherit; font-size: 13px; font-weight: 600"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" class="ic"><path d="M6 6l12 12M18 6L6 18"></path></svg>{{it.deny}}</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 12px; border-radius: 8px; border: 0; background: transparent; color: #A1A1A1; font: inherit; font-size: 13px; font-weight: 600"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" class="ic"><path d="M10 8L5 12.5 10 17M5.5 12.5H14a5 5 0 0 1 5 5V19"></path></svg>Reply</button>
<sc-if value="{{it.scope}}" hint-placeholder-val="{{ false }}">
<span style="flex: 1"></span>
<span style="font-size: 12px; color: #8A8A8A">Allow for</span>
<div role="radiogroup" aria-label="Approval scope" style="display: inline-flex; gap: 2px; padding: 3px; border-radius: 9px; background: #0A0A0A; border: 1px solid rgba(255,255,255,0.08)">
<button type="button" role="radio" aria-checked="true" style="height: 26px; padding: 0 10px; border-radius: 6px; border: 0; background: #262626; color: #EDEDED; font: inherit; font-size: 12px; font-weight: 500">Once</button>
<button type="button" role="radio" aria-checked="false" style="height: 26px; padding: 0 10px; border-radius: 6px; border: 0; background: transparent; color: #A1A1A1; font: inherit; font-size: 12px; font-weight: 500">This ticket</button>
<button type="button" role="radio" aria-checked="false" style="height: 26px; padding: 0 10px; border-radius: 6px; border: 0; background: transparent; color: #A1A1A1; font: inherit; font-size: 12px; font-weight: 500">Project</button>
</div>
</sc-if>
<sc-if value="{{it.link}}" hint-placeholder-val="{{ false }}">
<span style="flex: 1"></span>
<a href="{{it.linkHref}}" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: #EDEDED; text-decoration: none">{{it.link}}<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" class="ic"><path d="M10 7l5 5-5 5"></path></svg></a>
</sc-if>
</div>
</div>
</article>
</sc-for>

<button type="button" style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: 12px; border: 1px dashed rgba(255,255,255,0.14); background: transparent; color: #A1A1A1; font: inherit; font-size: 13px; text-align: left">
<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" class="ic"><path d="M10 7l5 5-5 5"></path></svg>
<span style="flex: 1">12 resolved today</span><span style="font-size: 12px; color: #8A8A8A">9 approved · 2 denied · 1 replied</span>
</button>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2200}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      network: 'M12 3.5a8.5 8.5 0 1 1 0 17a8.5 8.5 0 1 1 0-17zM3.5 12h17M12 3.5c2.5 2.6 3.5 5.5 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.5-3.5-8.5s1-5.9 3.5-8.5z',
      merge: 'M6 3.3a2.2 2.2 0 1 1 0 4.4a2.2 2.2 0 1 1 0-4.4zM6 16.3a2.2 2.2 0 1 1 0 4.4a2.2 2.2 0 1 1 0-4.4zM18 9.8a2.2 2.2 0 1 1 0 4.4a2.2 2.2 0 1 1 0-4.4zM6 7.7v8.6M6 8c0 3 3 4 9.8 4',
      question: 'M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-4.5 3.5V17H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z',
      plan: 'M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM14 3v5h5M9 13h6M9 17h4',
      secret: 'M8 11.5a3.5 3.5 0 1 1 0 7a3.5 3.5 0 1 1 0-7zM10.5 12.5L19 4M16 7l2.5 2.5M14 9l2 2',
      push: 'M12 16V5M7 10l5-5 5 5M5 19h14',
      database: 'M12 3.2c3.9 0 7 1.3 7 2.8s-3.1 2.8-7 2.8-7-1.3-7-2.8 3.1-2.8 7-2.8zM5 6v12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8V6M5 12c0 1.5 3.1 2.8 7 2.8s7-1.3 7-2.8'
    };
    const NAMES = { atlas: 'Atlas', ember: 'Ember', tide: 'Tide', flare: 'Flare', rosa: 'Rosa', iris: 'Iris', sol: 'Sol', hazel: 'Hazel' };
    const raw = [
      { agent: 'ember', kind: 'Network domain', icon: 'network', ticket: 'BRG-102', time: '1m', what: 'Reach registry.npmjs.org from the sandbox', why: 'Install date-fns-tz 3.2.0 for timezone-safe month-end maths. The sandbox has no network by default.', details: [{ k: 'Domain', v: 'registry.npmjs.org:443' }, { k: 'Command', v: 'pnpm add date-fns-tz@3.2.0' }], scope: true, focused: true, approve: 'Approve', deny: 'Deny' },
      { agent: 'hazel', kind: 'Ready to merge', icon: 'merge', ticket: 'BRG-103', time: '4m', what: 'Merge PR #482 into main', why: 'Review found nothing blocking: 1 major and 3 minor findings, all accepted. CI passed 14 of 14 checks.', details: [{ k: 'Branch', v: 'brg-103-schedules-api → main' }, { k: 'Diff', v: '+412 −38 · 9 files' }], link: 'Open review', linkHref: 'Review.dc.html', approve: 'Approve merge', deny: 'Request changes' },
      { agent: 'tide', kind: 'Question', icon: 'question', ticket: 'BRG-104', time: '7m', what: 'Should the schedule editor offer a custom interval, like every 3 weeks?', why: 'Spec §3 lists weekly, monthly and yearly presets only, but the design mock attached to BRG-104 shows a “Custom” option.', replyOpen: true, approve: 'Approve presets', deny: 'Deny' },
      { agent: 'atlas', kind: 'Plan approval', icon: 'plan', ticket: '', time: '12m', what: 'Add 2 tickets to the plan', why: 'Found while building BRG-102. Both sit outside the approved spec, so the plan gate reopens until you decide.', tickets: [{ id: 'BRG-113', title: 'Prorate when a schedule changes mid-cycle', agent: 'ember', note: 'Ember · after BRG-102' }, { id: 'BRG-114', title: 'Audit log for schedule edits', agent: 'hazel', note: 'Hazel · parallel' }], link: 'View plan', linkHref: 'Plan.dc.html', approve: 'Approve', deny: 'Deny' },
      { agent: 'flare', kind: 'Secret', icon: 'secret', ticket: 'BRG-107', time: '15m', what: 'Use STRIPE_TEST_SECRET_KEY in the sandbox', why: 'Run the payment integration test against Stripe test mode. The value is injected as an env var and masked in all output.', details: [{ k: 'Secret', v: 'STRIPE_TEST_SECRET_KEY · test mode' }, { k: 'Exposure', v: 'env var · masked in logs · revoked on stop' }], scope: true, approve: 'Approve', deny: 'Deny' },
      { agent: 'tide', kind: 'Git push', icon: 'push', ticket: 'BRG-104', time: '19m', what: 'Push brg-104-schedule-editor to origin', why: 'Open a draft PR so Rosa can review the editor layout while BRG-103 is merged.', details: [{ k: 'Remote', v: 'origin · github.com/tally/tally-web' }, { k: 'Commits', v: '3 · no force push' }], scope: true, approve: 'Approve', deny: 'Deny' },
      { agent: 'sol', kind: 'Database', icon: 'database', ticket: 'BRG-110', time: '22m', what: 'Run a read-only query on the analytics replica', why: 'Count customers by invoicing frequency to size the rollout. Names and emails stay masked.', details: [{ k: 'Database', v: 'analytics-replica · read-only role' }, { k: 'Tables', v: 'invoices, customers (PII masked)' }], scope: true, approve: 'Approve', deny: 'Deny' }
    ];
    const items = raw.map(function (r, i) {
      return {
        agent: r.agent, name: NAMES[r.agent], state: r.agent === 'atlas' ? 'planning' : 'listening', kind: r.kind, icon: I[r.icon], ticket: r.ticket, time: r.time,
        what: r.what, why: r.why, hid: 'inbox-item-' + i,
        details: r.details || [], hasDetails: !!r.details,
        tickets: r.tickets || [], hasTickets: !!r.tickets,
        replyOpen: !!r.replyOpen, scope: !!r.scope, link: r.link || '', linkHref: r.linkHref || '#',
        approve: r.approve, deny: r.deny,
        border: r.focused ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.08)',
        outline: r.focused ? '2px solid #EDEDED' : 'none'
      };
    });
    const filters = [['All', '7', true], ['Access', '4', false], ['Questions', '1', false], ['Merges', '1', false], ['Plans', '1', false]].map(function (f) {
      return { label: f[0], n: f[1], on: f[2] ? 'true' : 'false', bg: f[2] ? '#262626' : 'transparent', fg: f[2] ? '#EDEDED' : '#A1A1A1' };
    });
    return { items: items, filters: filters };
  }
}
</script>
</body>
</html>
